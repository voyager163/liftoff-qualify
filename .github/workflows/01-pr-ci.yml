# Checks every change: each part of the application with its own checks, and
# a review of new dependencies. Branch rules require one aggregate status,
# ci-gate, which fails unless every job succeeded: skipped, cancelled or
# missing jobs are failures, never passes.
name: CI

on:
  pull_request:
    # Edited too: the branch checks read the description and the base.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:
    inputs:
      pull_request:
        description: >-
          The pull request to check, when the release workflows start CI for
          one they opened (GitHub starts no workflows for those)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}
  # Cancel superseded pull request runs only; never a branch or queue run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The API: lint and format, tests with coverage, integration tests against
  # PostgreSQL and the container image build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          # A throwaway database for this job only; not a secret.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+psycopg://app:ci-only@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not published)
        run: docker build --tag api:ci .

  branch-policy:
    name: Branch policy
    # Which branches may merge into develop and main (see GOVERNANCE.md), and
    # that a release is a develop commit whose CI passed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # A run the release workflows started names its pull request instead.
      - name: Find the pull request's base
        id: pr
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          case "$PULL_REQUEST" in
            "" | 0* | *[!0-9]*)
              echo "::error::pull_request must be a pull request number, not \"$PULL_REQUEST\"."
              exit 1
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '"base=\(.base.sha)"' >> "$GITHUB_OUTPUT"
      # The check from the base branch, never the pull request's own copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base || github.sha }}
          sparse-checkout: |
            .github/liftoff
            .github/workflows/01-pr-ci.yml
          sparse-checkout-cone-mode: false
      - name: Check the branch policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Branches that tools open into develop.
          AUTOMATION_BRANCHES: dependabot
        run: |
          if [ -f .github/liftoff/branch-policy.mjs ]; then
            node .github/liftoff/branch-policy.mjs branch
          elif grep -q branch-policy.mjs .github/workflows/01-pr-ci.yml 2> /dev/null; then
            echo "::error::The base branch's CI runs this check, but its .github/liftoff/branch-policy.mjs is missing."
            exit 1
          else
            # This pull request is the one that adds the checks.
            echo "::notice::The base branch does not have the branch checks yet; they apply to pull requests after this one merges."
          fi

  release-lineage:
    name: Release lineage
    # A pull request into main must contain the current main, so merging it
    # leaves exactly the tree CI qualified.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A run the release workflows started names its pull request instead.
      - name: Find the pull request's base
        id: pr
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          case "$PULL_REQUEST" in
            "" | 0* | *[!0-9]*)
              echo "::error::pull_request must be a pull request number, not \"$PULL_REQUEST\"."
              exit 1
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '"base=\(.base.sha)"' >> "$GITHUB_OUTPUT"
      # The check from the base branch, never the pull request's own copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base || github.sha }}
          sparse-checkout: |
            .github/liftoff
            .github/workflows/01-pr-ci.yml
          sparse-checkout-cone-mode: false
      - name: Check the release lineage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/liftoff/branch-policy.mjs ]; then
            node .github/liftoff/branch-policy.mjs lineage
          elif grep -q branch-policy.mjs .github/workflows/01-pr-ci.yml 2> /dev/null; then
            echo "::error::The base branch's CI runs this check, but its .github/liftoff/branch-policy.mjs is missing."
            exit 1
          else
            # This pull request is the one that adds the checks.
            echo "::notice::The base branch does not have the branch checks yet; they apply to pull requests after this one merges."
          fi

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A run the release workflows started names its pull request instead.
      - name: Find the pull request's commits
        id: pr
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          case "$PULL_REQUEST" in
            "" | 0* | *[!0-9]*)
              echo "::error::pull_request must be a pull request number, not \"$PULL_REQUEST\"."
              exit 1
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '"base=\(.base.sha)", "head=\(.head.sha)"' >> "$GITHUB_OUTPUT"
      - name: Explain runs without a pull request
        if: github.event_name != 'pull_request' && steps.pr.outputs.head == ''
        run: echo "Dependencies are reviewed on pull requests; nothing new to review here."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || steps.pr.outputs.head != ''
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request' || steps.pr.outputs.head != ''
        with:
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'on-failure' || 'never' }}
          # Empty on a pull_request event, where the action reads the event.
          base-ref: ${{ steps.pr.outputs.base }}
          head-ref: ${{ steps.pr.outputs.head }}

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test, integration, image, branch-policy, release-lineage, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const names = Object.keys(needs);
            if (names.length === 0) { console.error("no jobs reported"); process.exit(1); }
            let failed = false;
            for (const name of names) {
              const result = needs[name].result;
              console.log(name + ": " + result);
              if (result !== "success") failed = true;
            }
            process.exit(failed ? 1 : 0);
          '
